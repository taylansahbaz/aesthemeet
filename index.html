<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Aesthemeet - Natural and Permanent Hair Transplantation. Get c onsultation from our expert physicians.">
    <title>Aesthemeet - Hair Transplant</title>
    <script>
        // Detect browser language and redirect to appropriate version
        (function () {
            var lang = (navigator.language || navigator.userLanguage || 'tr').toLowerCase();
            var redirected = sessionStorage.getItem('aesthemeet_redirected');

            // Only auto-redirect once per session
            if (!redirected) {
                sessionStorage.setItem('aesthemeet_redirected', 'true');

                if (lang.startsWith('de')) {
                    window.location.replace('de/index.html');
                } else if (lang.startsWith('en')) {
                    window.location.replace('en/index.html');
                } else {
                    window.location.replace('tr/index.html');
                }
            } else {
                // Default redirect to TR if revisiting root
                window.location.replace('tr/index.html');
            }
        })();
    </script>
</head>

<body>
    <noscript>
        <meta http-equiv="refresh" content="0;url=tr/index.html">
        <p>Yönlendiriliyorsunuz... / Redirecting... / Weiterleitung...</p>
        <ul>
            <li><a href="tr/index.html">Türkçe</a></li>
            <li><a href="en/index.html">English</a></li>
            <li><a href="de/index.html">Deutsch</a></li>
        </ul>
    </noscript>
</body>

</html>
